<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Backstage map</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #eef1f3;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Bundled locally (no CDN) so the map renders in airplane mode. -->
    <script src="./vendor/leaflet/leaflet.js"></script>
    <script>
      // Event site bounding box (covers the mock Stocznia Sound 2027 stages/POIs).
      // Swap SITE_BOUNDS and SITE_PLAN_URL together when the real site plan arrives.
      var SITE_BOUNDS = [
        [54.3585, 18.644], // south-west
        [54.3665, 18.6535], // north-east
      ];
      var SITE_PLAN_URL = "./site-plan.svg";

      var map = L.map("map", {
        attributionControl: false,
        zoomControl: true,
      });

      L.imageOverlay(SITE_PLAN_URL, SITE_BOUNDS).addTo(map);
      map.fitBounds(SITE_BOUNDS);
      map.setMaxBounds(SITE_BOUNDS);
      map.options.maxBoundsViscosity = 1;

      // --- RN <-> WebView bridge (issue #30) -----------------------------
      // Marker colors are a placeholder until the real icon set lands (#44).
      var TYPE_COLORS = {
        s1: "#ef4444",
        s2: "#ef4444",
        s3: "#ef4444",
        toilet: "#3b82f6",
        water: "#06b6d4",
        medical: "#dc2626",
        gate: "#f59e0b",
        food: "#f59e0b",
        stop: "#8b5cf6",
        saved: "#10b981",
        me: "#111827",
      };

      var markersLayer = L.layerGroup().addTo(map);
      var userMarker = null;

      function postToRN(event) {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(event));
        }
      }

      function markerIcon(type, selected) {
        var color = TYPE_COLORS[type] || "#374151";
        var size = selected ? 22 : 16;
        return L.divIcon({
          className: "backstage-marker" + (selected ? " backstage-marker--selected" : ""),
          html:
            '<span style="display:block;width:' +
            size +
            "px;height:" +
            size +
            "px;border-radius:50%;background:" +
            color +
            ';border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.25);"></span>',
          iconSize: [size, size],
        });
      }

      function setMarkers(markers) {
        markersLayer.clearLayers();
        (markers || []).forEach(function (marker) {
          var m = L.marker([marker.latitude, marker.longitude], {
            icon: markerIcon(marker.type, !!marker.selected),
          });
          m.on("click", function () {
            postToRN({ type: "markerPressed", markerId: marker.id });
          });
          markersLayer.addLayer(m);
        });
      }

      function setUserPosition(position, headingDegrees) {
        if (userMarker) {
          map.removeLayer(userMarker);
          userMarker = null;
        }
        if (!position) {
          return;
        }
        var rotation = typeof headingDegrees === "number" ? headingDegrees : 0;
        userMarker = L.marker([position.latitude, position.longitude], {
          icon: L.divIcon({
            className: "backstage-marker backstage-marker--me",
            html:
              '<span style="display:block;width:20px;height:20px;border-radius:50%;background:#111827;border:2px solid #fff;transform:rotate(' +
              rotation +
              'deg);"></span>',
            iconSize: [20, 20],
          }),
          zIndexOffset: 1000,
        }).addTo(map);
      }

      function centerOn(latitude, longitude, zoom) {
        map.setView([latitude, longitude], typeof zoom === "number" ? zoom : map.getZoom());
      }

      window.__backstageHandleCommand = function (command) {
        if (!command || typeof command.type !== "string") {
          return;
        }
        if (command.type === "setMarkers") {
          setMarkers(command.markers);
        } else if (command.type === "setUserPosition") {
          setUserPosition(command.position, command.headingDegrees);
        } else if (command.type === "centerOn") {
          centerOn(command.latitude, command.longitude, command.zoom);
        }
      };

      map.on("moveend", function () {
        var b = map.getBounds();
        postToRN({
          type: "boundsChanged",
          bounds: {
            minLatitude: b.getSouth(),
            maxLatitude: b.getNorth(),
            minLongitude: b.getWest(),
            maxLongitude: b.getEast(),
          },
        });
      });
    </script>
  </body>
</html>
