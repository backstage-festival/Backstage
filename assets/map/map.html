<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Backstage map</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #eef1f3;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Bundled locally (no CDN) so the map renders in airplane mode. -->
    <script src="./vendor/leaflet/leaflet.js"></script>
    <script>
      // Event site bounding box (covers the mock Stocznia Sound 2027 stages/POIs).
      // Swap SITE_BOUNDS and SITE_PLAN_URL together when the real site plan arrives.
      var SITE_BOUNDS = [
        [54.3585, 18.644], // south-west
        [54.3665, 18.6535], // north-east
      ];
      var SITE_PLAN_URL = "./site-plan.svg";

      var map = L.map("map", {
        attributionControl: false,
        zoomControl: true,
      });

      L.imageOverlay(SITE_PLAN_URL, SITE_BOUNDS).addTo(map);
      map.fitBounds(SITE_BOUNDS);
      map.setMaxBounds(SITE_BOUNDS);
      map.options.maxBoundsViscosity = 1;

      // --- RN <-> WebView bridge (issue #30) -----------------------------
      var markersLayer = L.layerGroup().addTo(map);
      var userMarker = null;
      var lastMarkers = [];
      var lastUserPosition = null;
      var lastHeadingDegrees = 0;

      function postToRN(event) {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(event));
        }
      }

      // --- Marker icon theming (issue #44, H04) ---------------------------
      // Each type has a fixed SHAPE (so markers stay tellable apart by
      // outline alone, not just color) and each theme provides a PALETTE.
      // "wzory-cvd" additionally fills shapes with a pattern, not flat
      // color, so color-blind users don't rely on hue alone. These are
      // generated placeholders — swap for the real `ikony/znaczniki-mapy`
      // design export without touching this rendering logic.
      var SHAPES = {
        s1: "square",
        s2: "square",
        s3: "square",
        toilet: "circle",
        water: "circle",
        medical: "cross",
        gate: "triangle",
        food: "circle",
        stop: "hexagon",
        saved: "star",
        me: "circle",
      };

      var LABELS = {
        s1: "1",
        s2: "2",
        s3: "3",
      };

      var THEMES = {
        domyslny: {
          colors: {
            s1: "#ef4444",
            s2: "#f97316",
            s3: "#a855f7",
            toilet: "#3b82f6",
            water: "#06b6d4",
            medical: "#dc2626",
            gate: "#eab308",
            food: "#f59e0b",
            stop: "#8b5cf6",
            saved: "#10b981",
            me: "#111827",
          },
          pattern: null,
        },
        "wzory-cvd": {
          colors: {
            s1: "#0072b2",
            s2: "#e69f00",
            s3: "#cc79a7",
            toilet: "#0072b2",
            water: "#56b4e9",
            medical: "#d55e00",
            gate: "#e69f00",
            food: "#f0e442",
            stop: "#cc79a7",
            saved: "#009e73",
            me: "#000000",
          },
          pattern: {
            s1: "dots",
            s2: "stripes",
            s3: "cross",
            toilet: "dots",
            water: "stripes",
            medical: "cross",
            gate: "stripes",
            food: "dots",
            stop: "cross",
            saved: "stripes",
            me: null,
          },
        },
        "wysoki-kontrast": {
          colors: {
            s1: "#000000",
            s2: "#000000",
            s3: "#000000",
            toilet: "#000000",
            water: "#000000",
            medical: "#000000",
            gate: "#000000",
            food: "#000000",
            stop: "#000000",
            saved: "#000000",
            me: "#ffd400",
          },
          pattern: null,
          highContrastOutline: "#ffd400",
        },
      };

      var currentTheme = "domyslny";
      var PATTERN_ID_PREFIX = "backstage-pattern-";
      var definedPatternIds = {};

      function ensurePatternDefs(patternName, color) {
        var id = PATTERN_ID_PREFIX + patternName + "-" + color.replace("#", "");
        if (definedPatternIds[id]) {
          return id;
        }
        var svgNs = "http://www.w3.org/2000/svg";
        var defsHost = document.getElementById("backstage-svg-defs");
        if (!defsHost) {
          var svg = document.createElementNS(svgNs, "svg");
          svg.setAttribute("width", "0");
          svg.setAttribute("height", "0");
          svg.style.position = "absolute";
          var defs = document.createElementNS(svgNs, "defs");
          defs.id = "backstage-svg-defs";
          svg.appendChild(defs);
          document.body.appendChild(svg);
          defsHost = defs;
        }
        var pattern = document.createElementNS(svgNs, "pattern");
        pattern.id = id;
        pattern.setAttribute("patternUnits", "userSpaceOnUse");
        pattern.setAttribute("width", "6");
        pattern.setAttribute("height", "6");
        if (patternName === "dots") {
          pattern.innerHTML =
            '<rect width="6" height="6" fill="#fff" /><circle cx="2" cy="2" r="1.3" fill="' + color + '" />';
        } else if (patternName === "stripes") {
          pattern.innerHTML =
            '<rect width="6" height="6" fill="#fff" /><rect width="3" height="6" fill="' + color + '" />';
        } else if (patternName === "cross") {
          pattern.innerHTML =
            '<rect width="6" height="6" fill="#fff" />' +
            '<rect x="2.3" width="1.4" height="6" fill="' + color + '" />' +
            '<rect y="2.3" width="6" height="1.4" fill="' + color + '" />';
        }
        defsHost.appendChild(pattern);
        definedPatternIds[id] = true;
        return id;
      }

      function shapeSvgBody(shape, label) {
        switch (shape) {
          case "square":
            return (
              '<rect x="3" y="3" width="18" height="18" rx="3" />' +
              (label
                ? '<text x="12" y="16.5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">' +
                  label +
                  "</text>"
                : "")
            );
          case "cross":
            return '<rect x="9.5" y="3" width="5" height="18" rx="1.5" /><rect x="3" y="9.5" width="18" height="5" rx="1.5" />';
          case "triangle":
            return '<polygon points="12,3 21,20 3,20" />';
          case "hexagon":
            return '<polygon points="12,2 20.5,7 20.5,17 12,22 3.5,17 3.5,7" />';
          case "star":
            return '<polygon points="12,2 14.7,9 22,9.3 16.2,14 18.2,21.2 12,17.1 5.8,21.2 7.8,14 2,9.3 9.3,9" />';
          case "circle":
          default:
            return '<circle cx="12" cy="12" r="9" />';
        }
      }

      function markerSvg(type, selected, theme) {
        var def = THEMES[theme] || THEMES.domyslny;
        var color = def.colors[type] || "#374151";
        var shape = SHAPES[type] || "circle";
        var patternName = def.pattern && def.pattern[type];
        var fillValue = color;
        var extraDefs = "";
        if (patternName) {
          var patternId = ensurePatternDefs(patternName, color);
          fillValue = "url(#" + patternId + ")";
        }
        var strokeColor = def.highContrastOutline || "#ffffff";
        var strokeWidth = theme === "wysoki-kontrast" ? 2.5 : 2;
        var size = selected ? 30 : 24;
        var body = shapeSvgBody(shape, LABELS[type]);
        return (
          '<svg width="' +
          size +
          '" height="' +
          size +
          '" viewBox="0 0 24 24" style="color:' +
          color +
          '; fill:' +
          fillValue +
          "; stroke:" +
          strokeColor +
          "; stroke-width:" +
          strokeWidth +
          '; overflow:visible;" aria-hidden="true">' +
          (selected
            ? '<circle cx="12" cy="12" r="11" fill="none" stroke="' +
              strokeColor +
              '" stroke-width="1.5" stroke-dasharray="2 2" />'
            : "") +
          body +
          extraDefs +
          "</svg>"
        );
      }

      function markerIcon(type, selected) {
        var touchSize = selected ? 64 : 48;
        var visualSize = selected ? 30 : 24;
        var pad = (touchSize - visualSize) / 2;
        return L.divIcon({
          className:
            "backstage-marker backstage-marker--" +
            type +
            (selected ? " backstage-marker--selected" : ""),
          html: '<div style="padding:' + pad + 'px;">' + markerSvg(type, selected, currentTheme) + '</div>',
          iconSize: [touchSize, touchSize],
          iconAnchor: [touchSize / 2, touchSize / 2],
        });
      }

      function userMarkerIcon(headingDegrees) {
        var def = THEMES[currentTheme] || THEMES.domyslny;
        var color = def.colors.me;
        var html =
          '<div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative;">' +
          '<div style="width:26px;height:26px;position:relative;">' +
          '<div style="position:absolute;inset:0;transform:rotate(' +
          headingDegrees +
          'deg);transform-origin:50% 50%;">' +
          // heading cone, pointing up (north) before rotation
          '<svg width="26" height="26" viewBox="0 0 26 26" style="position:absolute;top:-10px;left:0;" aria-hidden="true">' +
          '<polygon points="13,0 20,16 13,12 6,16" fill="' +
          color +
          '" opacity="0.55" />' +
          "</svg>" +
          "</div>" +
          '<svg width="26" height="26" viewBox="0 0 24 24" style="position:relative;" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="8" fill="' +
          color +
          '" stroke="#ffffff" stroke-width="2.5" />' +
          "</svg>" +
          "</div>" +
          "</div>";
        return L.divIcon({
          className: "backstage-marker backstage-marker--me",
          html: html,
          iconSize: [48, 48],
          iconAnchor: [24, 24],
        });
      }

      function renderMarkers() {
        markersLayer.clearLayers();
        lastMarkers.forEach(function (marker) {
          var m = L.marker([marker.latitude, marker.longitude], {
            icon: markerIcon(marker.type, !!marker.selected),
          });
          m.on("click", function () {
            postToRN({ type: "markerPressed", markerId: marker.id });
          });
          markersLayer.addLayer(m);
        });
      }

      function renderUserMarker() {
        if (userMarker) {
          map.removeLayer(userMarker);
          userMarker = null;
        }
        if (!lastUserPosition) {
          return;
        }
        userMarker = L.marker([lastUserPosition.latitude, lastUserPosition.longitude], {
          icon: userMarkerIcon(lastHeadingDegrees),
          zIndexOffset: 1000,
        }).addTo(map);
      }

      function setMarkers(markers) {
        lastMarkers = markers || [];
        renderMarkers();
      }

      function setUserPosition(position, headingDegrees) {
        lastUserPosition = position || null;
        lastHeadingDegrees = typeof headingDegrees === "number" ? headingDegrees : 0;
        renderUserMarker();
      }

      function setTheme(theme) {
        if (!THEMES[theme]) {
          return;
        }
        currentTheme = theme;
        renderMarkers();
        renderUserMarker();
      }

      function centerOn(latitude, longitude, zoom) {
        map.setView([latitude, longitude], typeof zoom === "number" ? zoom : map.getZoom());
      }

      window.__backstageHandleCommand = function (command) {
        if (!command || typeof command.type !== "string") {
          return;
        }
        if (command.type === "setMarkers") {
          setMarkers(command.markers);
        } else if (command.type === "setUserPosition") {
          setUserPosition(command.position, command.headingDegrees);
        } else if (command.type === "centerOn") {
          centerOn(command.latitude, command.longitude, command.zoom);
        } else if (command.type === "setTheme") {
          setTheme(command.theme);
        }
      };

      map.on("moveend", function () {
        var b = map.getBounds();
        postToRN({
          type: "boundsChanged",
          bounds: {
            minLatitude: b.getSouth(),
            maxLatitude: b.getNorth(),
            minLongitude: b.getWest(),
            maxLongitude: b.getEast(),
          },
        });
      });

      postToRN({ type: "mapReady" });
    </script>
  </body>
</html>
